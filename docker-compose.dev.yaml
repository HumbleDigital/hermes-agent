# Docker Compose config for local development
# Usage: docker compose -f docker-compose.dev.yaml up
services:
  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    image: hd-hermes-agent:dev
    container_name: hermes-gilfoyle-dev
    ports:
      - "8080:8080"
    environment:
      # GCP project for Secret Manager bootstrap and tool auth
      - GOOGLE_CLOUD_PROJECT=humble-ops
      # DWD subject for Google Chat and other Workspace APIs
      - GOOGLE_CHAT_DWD_SUBJECT=scoobycarolan@humbledigital.net
      # Secret prefix to fetch (only secrets starting with this will be injected)
      - HERMES_SECRET_PREFIX=hermes-
      # Explicit mapping: GCP secret name = ENV_VAR_NAME
      # Secrets not listed here use the default convention:
      #   hermes-google-ai-studio-api-key -> GOOGLE_AI_STUDIO_API_KEY
      #   hermes-ollama-api-key -> OLLAMA_API_KEY
      - HERMES_SECRET_MAPPING=hermes-google-ai-studio-api-key=GEMINI_API_KEY,hermes-ollama-api-key=OLLAMA_API_KEY
    volumes:
      # Persist hermes data (sessions, memories, config) across restarts
      - hermes-data:/opt/data
      # Mount gcloud ADC credentials for GCP auth
      - ~/.config/gcloud/application_default_credentials.json:/opt/creds/application_default_credentials.json:ro
    env_file:
      # Optional: local .env for overrides (takes precedence over secret bootstrap)
      - path: .env
        required: false

volumes:
  hermes-data: