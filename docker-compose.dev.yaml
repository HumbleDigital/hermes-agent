# Local development environment for hd-hermes-agent
# Mounts your gilfoyle profile for persistent state
# Usage: docker compose -f docker-compose.dev.yaml up --build

services:
  hermes-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-gilfoyle-dev
    environment:
      - HERMES_HOME=/opt/data
      - HERMES_UID=${HERMES_UID:-501}  # Match your host UID for file permissions
      - HERMES_GID=${HERMES_GID:-20}   # Match your host GID
      # GCP credentials - mount ADC from host
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/creds/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=humble-ops
      # Agent comms config
      - GOOGLE_CHAT_DWD_SUBJECT=scoobycarolan@humbledigital.net
      - GCP_TASKS_LOCATION=us-east1
      - GCP_STORAGE_LOCATION=us-east1
    volumes:
      # Persistent Hermes state (your gilfoyle profile)
      - ~/.hermes/profiles/gilfoyle:/opt/data
      # GCP credentials (read-only)
      - ~/.config/gcloud/application_default_credentials.json:/opt/creds/application_default_credentials.json:ro
      # Code mount for hot reload (optional - comment out for production test)
      # - .:/opt/hermes
    ports:
      - "8080:8080"  # Webhook ingress
    stdin_open: true
    tty: true
    # Override entrypoint for interactive dev
    # entrypoint: ["/bin/bash"]
    # For production test, use default entrypoint and pass gateway run command
    command: ["gateway", "run", "--replace"]
